<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Voice Prompter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --panel: #0b0b0c;
    --ink: #d9d7d0;
    --muted: #7d8087;
    --line: #26272a;
    --accent: #f2b233;
    --accent-ink: #1a1200;
    --font: "Atkinson Hyperlegible", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { background: #000; color-scheme: dark; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font);
    -webkit-text-size-adjust: 100%; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  button, select { font: inherit; color: inherit; }

  /* ---------- Setup ---------- */
  #setup { height: 100%; display: flex; flex-direction: column; gap: 14px; padding: 20px; max-width: 900px; margin: 0 auto; }
  #setup h1 { font-size: 26px; margin: 4px 0 0; letter-spacing: -0.01em; }
  #setup p.sub { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.4; }
  #script {
    flex: 1; min-height: 0; width: 100%; resize: none; padding: 16px;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 12px;
    font: 20px/1.5 var(--font);
  }
  #script:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .row label { font-size: 15px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
  input[type=range] { accent-color: var(--accent); width: 160px; }
  select {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font-size: 16px; color: var(--ink); min-height: 44px;
  }
  .btn {
    border: 1px solid var(--line); background: var(--panel); border-radius: 12px;
    padding: 12px 18px; font-size: 17px; cursor: pointer; min-height: 48px;
  }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .spacer { flex: 1; }
  #support { color: #c0392b; font-size: 14px; display: none; }
  #wc { font-size: 14px; color: var(--muted); }

  /* ---------- Prompter ---------- */
  #prompter { position: fixed; inset: 0; background: #000; display: none; overflow: hidden; }
  #stage { position: absolute; inset: 0; }
  #stage.mirror { transform: scaleX(-1); }
  #track {
    position: absolute; left: 0; right: 0; top: 0;
    padding: 0 7vw 60vh; color: #f3f1ea;
    font-family: var(--font); font-weight: 700; line-height: 1.38;
    font-size: var(--fs, 56px);
    transition: transform 0.45s cubic-bezier(.25,.7,.25,1);
    will-change: transform;
  }
  #track.instant, #track.noanim { transition: none; }
  #track p { margin: 0 0 0.55em; }
  #track .gap { height: 0.9em; }
  .w { display: inline-block; margin-right: 0.28em; cursor: pointer; border-radius: 6px; }
  .w.cur { color: #ffd166; }
  #guide { position: absolute; left: 0; right: 0; top: 50%; height: 0; pointer-events: none; }
  #guide::before, #guide::after {
    content: ""; position: absolute; top: -10px; width: 16px; height: 20px; background: #ffd166; opacity: .85;
  }
  #guide::before { left: 0; clip-path: polygon(0 0, 100% 50%, 0 100%); }
  #guide::after { right: 0; clip-path: polygon(100% 0, 0 50%, 100% 100%); }
  #progress { position: absolute; left: 0; top: 0; height: 3px; background: #ffd166; width: 0; opacity: .8; transition: width .4s; z-index: 5; }

  #bar {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    display: flex; flex-direction: column; gap: 8px; align-items: center; padding: 8px;
    max-width: 96vw;
    background: rgba(28,28,30,.9); border: 1px solid #333; border-radius: 18px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    z-index: 10; transition: opacity .3s;
  }
  #bar.hidden { opacity: 0; pointer-events: none; }
  .rowb { display: flex; gap: 8px; align-items: center; justify-content: center; }
  #bar button {
    background: #26272a; color: #eee; border: 1px solid #38393d; border-radius: 12px;
    min-width: 48px; height: 48px; padding: 0 14px; font-size: 17px; cursor: pointer; white-space: nowrap;
  }
  #bar button:focus-visible { outline: 3px solid #ffd166; outline-offset: 2px; }
  #bar button.on { background: #ffd166; color: #1a1200; border-color: #ffd166; font-weight: 700; }
  #bar .sep { width: 1px; height: 28px; background: #3a3b3f; }
  #wpm { color: #bbb; font-size: 16px; min-width: 78px; text-align: center; }
  #mic.live .dot { background: #ff5a4d; animation: pulse 1.4s infinite; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #777; margin-right: 8px; vertical-align: middle; }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { #mic.live .dot { animation: none; } #track { transition: none; } }

  #heard {
    position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 10px);
    text-align: center; color: #555; font-size: 14px; z-index: 6; pointer-events: none;
    padding: 0 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #msg {
    position: absolute; left: 50%; top: 18%; transform: translateX(-50%); z-index: 12;
    background: rgba(40,20,20,.95); color: #ffb4a8; border: 1px solid #5a2a24; padding: 12px 18px;
    border-radius: 12px; font-size: 16px; max-width: 80%; display: none; text-align: center;
  }
</style>
</head>
<body>

<section id="setup">
  <div>
    <h1>Voice Prompter</h1>
    <p class="sub">Paste your script. Follow your voice, or scroll automatically at your own speed.</p>
  </div>
  <textarea id="script" placeholder="Paste or type your script here…" spellcheck="false"></textarea>
  <div id="support">Speech recognition isn't available in this browser. You can still use Auto scroll mode.</div>
  <div class="row">
    <label>Mode
      <select id="mode" aria-label="Mode">
        <option value="voice">Follow my voice</option>
        <option value="auto">Auto scroll</option>
      </select>
    </label>
    <label>Text size <input type="range" id="size" min="32" max="120" value="56" aria-label="Text size"></label>
    <label><input type="checkbox" id="mirrorChk"> Mirror</label>
    <span id="wc"></span>
    <span class="spacer"></span>
    <button class="btn" id="clear">Clear</button>
    <button class="btn primary" id="start">Start prompting</button>
  </div>
</section>

<section id="prompter" aria-label="Teleprompter">
  <div id="progress"></div>
  <div id="heard"></div>
  <div id="msg" role="alert"></div>
  <div id="stage">
    <div id="track"></div>
    <div id="guide"></div>
  </div>
  <div id="bar" role="toolbar" aria-label="Prompter controls">
    <div class="rowb">
      <button id="back" aria-label="Back to script">Edit</button>
      <button id="restart" aria-label="Restart from top">Top</button>
      <span class="sep"></span>
      <button id="prev" aria-label="Back one sentence">&#9664;&#9664;</button>
      <button id="mic" aria-label="Toggle listening"><span class="dot"></span><span id="micLabel">Listen</span></button>
      <button id="play" aria-label="Play or pause auto scroll">&#9654; Scroll</button>
      <button id="next" aria-label="Forward one sentence">&#9654;&#9654;</button>
    </div>
    <div class="rowb">
      <button id="slower" aria-label="Scroll slower">Slower</button>
      <span id="wpm">140 wpm</span>
      <button id="faster" aria-label="Scroll faster">Faster</button>
      <span class="sep"></span>
      <button id="smaller" aria-label="Smaller text">A&minus;</button>
      <button id="bigger" aria-label="Larger text">A+</button>
      <button id="mirrorBtn" aria-label="Mirror text">Flip</button>
      <button id="full" aria-label="Full screen">Full</button>
    </div>
  </div>
</section>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  // ---------- storage helpers ----------
  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }

  // ---------- state ----------
  var tokens = [];      // {text, norm, el}
  var valid = [];       // display indices of tokens with a norm
  var C = [];           // normalized words, compressed
  var prefix = [];      // prefix[i] = number of valid tokens before display index i
  var pos = 0;          // compressed pointer: words consumed
  var fs = parseInt(load('vp_fs', '56'), 10) || 56;
  var mirror = load('vp_mirror', '0') === '1';
  var mode = load('vp_mode', 'voice');
  var wpm = parseInt(load('vp_wpm', '140'), 10) || 140;
  var wantListening = false;
  var rec = null;
  var wakeLock = null;
  var hideTimer = null;

  // auto-scroll state
  var autoOn = false, lines = [], lineOf = [], metricsDirty = true;
  var cy = 0, lastTs = 0, endCy = 0, pxPerWord = 40;

  // ---------- setup screen ----------
  var scriptEl = $('script');
  scriptEl.value = load('vp_script', '');
  $('size').value = fs;
  $('mirrorChk').checked = mirror;
  $('mode').value = mode;
  if (!SR) $('support').style.display = 'block';

  function updateWc() {
    var n = (scriptEl.value.match(/\S+/g) || []).length;
    $('wc').textContent = n ? n + ' words' : '';
  }
  updateWc();
  scriptEl.addEventListener('input', function () { store('vp_script', scriptEl.value); updateWc(); });
  $('size').addEventListener('input', function () { fs = parseInt(this.value, 10); store('vp_fs', fs); });
  $('mirrorChk').addEventListener('change', function () { mirror = this.checked; store('vp_mirror', mirror ? '1' : '0'); });
  $('mode').addEventListener('change', function () { mode = this.value; store('vp_mode', mode); });
  $('clear').addEventListener('click', function () { scriptEl.value = ''; store('vp_script', ''); updateWc(); scriptEl.focus(); });

  // ---------- text normalization & matching ----------
  function norm(w) {
    return w.toLowerCase().replace(/[’']/g, '').replace(/[^\p{L}\p{N}]/gu, '');
  }
  function lev1(a, b) {
    if (Math.abs(a.length - b.length) > 1) return false;
    var i = 0, j = 0, d = 0;
    while (i < a.length && j < b.length) {
      if (a[i] === b[j]) { i++; j++; continue; }
      if (++d > 1) return false;
      if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; }
    }
    return d + (a.length - i) + (b.length - j) <= 1;
  }
  function eq(a, b) {
    if (a === b) return true;
    if (a.length >= 4 && b.length >= 4 && (a.indexOf(b) === 0 || b.indexOf(a) === 0)) return true;
    if (a.length >= 5 && b.length >= 5 && lev1(a, b)) return true;
    return false;
  }
  var STOP = {};
  ('the a an and of to in is it that this for on with as was at by be i you he she we they or but so if are ' +
   'his her my your our there from have has had not do did its them then than into just me us him what')
    .split(' ').forEach(function (w) { STOP[w] = 1; });
  function isStop(w) { return STOP[w] === 1 || w.length <= 2; }

  function build() {
    var track = $('track');
    track.innerHTML = '';
    tokens = []; valid = []; C = []; prefix = [];
    var lines_ = scriptEl.value.replace(/\r/g, '').split('\n');
    lines_.forEach(function (line) {
      var words = line.split(/\s+/).filter(Boolean);
      if (!words.length) {
        var g = document.createElement('div'); g.className = 'gap'; track.appendChild(g); return;
      }
      var p = document.createElement('p');
      words.forEach(function (w) {
        var s = document.createElement('span');
        s.className = 'w'; s.textContent = w;
        var idx = tokens.length;
        var n = norm(w.replace(/[-–—\/]/g, ''));
        tokens.push({ text: w, norm: n, el: s });
        s.addEventListener('click', function () { jumpToDisplay(idx); });
        p.appendChild(s);
      });
      track.appendChild(p);
    });
    var count = 0;
    tokens.forEach(function (t, i) {
      prefix[i] = count;
      if (t.norm) { valid.push(i); C.push(t.norm); count++; }
    });
    prefix[tokens.length] = count;
    metricsDirty = true;
  }

  // ---------- positioning ----------
  var shownPos = -1;
  function render(instant, noCenter) {
    if (!tokens.length) return;
    var curDisp = pos < valid.length ? valid[pos] : -1;
    var prevDisp = shownPos < 0 ? -1 : (shownPos < valid.length ? valid[shownPos] : -1);
    if (shownPos >= 0 && prevDisp >= 0 && prevDisp < tokens.length) tokens[prevDisp].el.classList.remove('cur');
    if (shownPos < 0) tokens.forEach(function (t) { t.el.classList.remove('cur'); });
    if (curDisp >= 0) tokens[curDisp].el.classList.add('cur');
    shownPos = pos;
    if (!noCenter) center(instant);
    $('progress').style.width = (valid.length ? Math.min(100, pos / valid.length * 100) : 0) + '%';
  }
  function center(instant) {
    if (!tokens.length) return;
    var d = pos < valid.length ? valid[pos] : tokens.length - 1;
    var el = tokens[d].el;
    var stageH = $('stage').clientHeight;
    var y = stageH * 0.5 - (el.offsetTop + el.offsetHeight / 2);
    var track = $('track');
    if (instant) track.classList.add('instant');
    track.style.transform = 'translateY(' + y + 'px)';
    if (instant) { void track.offsetHeight; track.classList.remove('instant'); }
  }
  function setPos(p, instant) {
    pos = Math.max(0, Math.min(valid.length, p));
    render(instant);
    if (autoOn) { if (metricsDirty) computeMetrics(); cy = cyForPos(); }
  }
  function jumpToDisplay(i) { setPos(prefix[i], false); }

  function sentenceStarts() {
    var starts = [0];
    tokens.forEach(function (t, i) {
      if (/[.!?]["')\]”’]*$/.test(t.text) && i + 1 < tokens.length) starts.push(prefix[i + 1]);
    });
    return starts;
  }
  function stepSentence(dir) {
    var s = sentenceStarts();
    if (dir > 0) {
      for (var i = 0; i < s.length; i++) if (s[i] > pos) { setPos(s[i]); return; }
      setPos(valid.length);
    } else {
      for (var j = s.length - 1; j >= 0; j--) if (s[j] < pos - 1) { setPos(s[j]); return; }
      setPos(0);
    }
  }

  // ---------- voice matching (short look-ahead, content words weigh more) ----------
  var AHEAD = 12;      // normal look-ahead, roughly one sentence
  function advanceFrom(spokenWords) {
    var T = spokenWords.slice(-6);
    var k = T.length;
    if (!k || !C.length) return;
    var last = T[k - 1];
    var best = -1, bestScore = 0, bestD = 1e9;
    var from = Math.max(0, pos - 2), to = Math.min(C.length - 1, pos + AHEAD);
    for (var e = from; e <= to; e++) {
      if (!eq(last, C[e])) continue;
      var score = isStop(C[e]) ? 1 : 2, matched = 1;
      for (var j = 1; j < k && e - j >= 0; j++) {
        if (eq(T[k - 1 - j], C[e - j])) { score += isStop(C[e - j]) ? 1 : 2; matched++; }
      }
      var d = e + 1 - pos;
      if (d <= 0) continue;                              // never move backward here
      if (d <= 3) { if (score < 2) continue; }           // small step: one content word is enough
      else if (score < 4 || matched < 2) continue;       // bigger step: needs real evidence
      if (score > bestScore || (score === bestScore && d < bestD)) { best = e + 1; bestScore = score; bestD = d; }
    }
    if (best >= 0) { setPos(best); return; }

    // Recovery: if you re-read or skipped, relock only on a run of consecutive matching words
    if (k < 3) return;
    var rBest = -1, rRun = 0, rDist = 1e9;
    var rFrom = Math.max(0, pos - 30), rTo = Math.min(C.length - 1, pos + 60);
    for (var x = rFrom; x <= rTo; x++) {
      var run = 0, content = 0;
      while (run < k && x - run >= 0 && eq(T[k - 1 - run], C[x - run])) { if (!isStop(C[x - run])) content++; run++; }
      if (!content) continue;
      var dist = Math.abs(x + 1 - pos);
      var need = dist <= 15 ? 3 : 5;
      if (run < need || x + 1 === pos) continue;
      if (run > rRun || (run === rRun && dist < rDist)) { rBest = x + 1; rRun = run; rDist = dist; }
    }
    if (rBest >= 0) setPos(rBest);
  }

  function startRec() {
    if (!SR) return;
    if (rec) { try { rec.onend = null; rec.abort(); } catch (e) {} }
    rec = new SR();
    rec.continuous = true;
    rec.interimResults = true;
    rec.lang = navigator.language || 'en-US';
    rec.onresult = function (ev) {
      var text = '';
      for (var i = 0; i < ev.results.length; i++) text += ev.results[i][0].transcript + ' ';
      var words = text.split(/\s+/).map(norm).filter(Boolean);
      $('heard').textContent = words.slice(-8).join(' ');
      advanceFrom(words);
    };
    rec.onerror = function (ev) {
      if (ev.error === 'service-not-allowed') {
        wantListening = false; setListening(false);
        showMsg('Safari speech service is off (' + ev.error + '). Go to Settings > General > Keyboard and turn on Enable Dictation, then reload this page.');
      } else if (ev.error === 'not-allowed') {
        wantListening = false; setListening(false);
        showMsg('Safari refused speech access (' + ev.error + '). If this page opened inside another app or a preview, open the link directly in Safari. Otherwise tap aA in the address bar, then Website Settings, and set Microphone to Allow.');
      } else if (ev.error !== 'no-speech' && ev.error !== 'aborted') {
        showMsg('Speech error: ' + ev.error);
      }
    };
    rec.onend = function () {
      if (wantListening) setTimeout(function () { if (wantListening) { try { startRec(); } catch (e) {} } }, 150);
      else setListening(false);
    };
    try { rec.start(); setListening(true); } catch (e) { setListening(false); }
  }
  function stopRec() {
    wantListening = false;
    if (rec) { try { rec.onend = null; rec.stop(); } catch (e) {} }
    setListening(false);
    $('heard').textContent = '';
  }
  function setListening(on) {
    $('mic').classList.toggle('live', on);
    $('mic').classList.toggle('on', on);
    $('micLabel').textContent = on ? 'Listening' : 'Listen';
  }
  function toggleListen() {
    if (!SR) { showMsg('Speech recognition isn\u2019t available here. Use Auto scroll, or tap any word to jump to it.'); return; }
    if (autoOn) stopAuto();
    if (wantListening) stopRec(); else { wantListening = true; startRec(); }
  }

  // ---------- auto scroll ----------
  function computeMetrics() {
    lines = []; lineOf = new Array(tokens.length);
    var lastTop = null;
    tokens.forEach(function (t, i) {
      var el = t.el, top = el.offsetTop;
      if (lastTop === null || Math.abs(top - lastTop) > 2) {
        lines.push({ first: i, last: i, cy: top + el.offsetHeight / 2, h: el.offsetHeight });
        lastTop = top;
      } else {
        lines[lines.length - 1].last = i;
      }
      lineOf[i] = lines.length - 1;
    });
    if (lines.length) {
      var L = lines[lines.length - 1];
      var step = lines.length > 1 ? L.cy - lines[lines.length - 2].cy : L.h * 1.4;
      endCy = L.cy + Math.max(step, 1);
      pxPerWord = Math.max(1, (endCy - lines[0].cy) / Math.max(1, valid.length));
    }
    metricsDirty = false;
  }
  function cyOf(l) { return l < lines.length ? lines[l].cy : endCy; }
  function cyForPos() {
    if (!lines.length) return 0;
    var d = pos < valid.length ? valid[pos] : tokens.length - 1;
    var l = lineOf[d], ln = lines[l];
    var count = ln.last - ln.first + 1;
    return ln.cy + (cyOf(l + 1) - ln.cy) * ((d - ln.first) / count);
  }
  function applyCy() {
    var stageH = $('stage').clientHeight;
    $('track').style.transform = 'translateY(' + (stageH * 0.5 - cy) + 'px)';
    var l = 0;
    var lo = 0, hi = lines.length - 1;
    while (lo < hi) { var mid = (lo + hi + 1) >> 1; if (lines[mid].cy <= cy) lo = mid; else hi = mid - 1; }
    l = lo;
    var span = cyOf(l + 1) - cyOf(l);
    var frac = span > 0 ? Math.max(0, Math.min(0.999, (cy - cyOf(l)) / span)) : 0;
    var count = lines[l].last - lines[l].first + 1;
    var wi = lines[l].first + Math.min(count - 1, Math.floor(frac * count));
    var np = prefix[wi];
    if (np !== pos) { pos = np; render(false, true); }
  }
  function tick(ts) {
    if (!autoOn) return;
    if (!lastTs) lastTs = ts;
    var dt = Math.min(0.1, (ts - lastTs) / 1000); lastTs = ts;
    if (metricsDirty) { computeMetrics(); cy = cyForPos(); }
    cy += (wpm / 60) * pxPerWord * dt;
    if (cy >= endCy) { stopAuto(); setPos(valid.length); return; }
    applyCy();
    requestAnimationFrame(tick);
  }
  function startAuto() {
    if (!tokens.length) return;
    if (wantListening) stopRec();
    if (pos >= valid.length) setPos(0, true);
    computeMetrics();
    cy = cyForPos();
    autoOn = true; lastTs = 0;
    $('track').classList.add('noanim');
    updatePlay();
    requestAnimationFrame(tick);
  }
  function stopAuto() {
    autoOn = false;
    $('track').classList.remove('noanim');
    updatePlay();
  }
  function togglePlay() { if (autoOn) stopAuto(); else startAuto(); }
  function updatePlay() {
    $('play').innerHTML = autoOn ? '&#10074;&#10074; Pause' : '&#9654; Scroll';
    $('play').classList.toggle('on', autoOn);
  }
  function updateWpm() { $('wpm').textContent = wpm + ' wpm'; }

  function showMsg(t) {
    var m = $('msg'); m.textContent = t; m.style.display = 'block';
    clearTimeout(showMsg._t); showMsg._t = setTimeout(function () { m.style.display = 'none'; }, 14000);
  }

  // ---------- wake lock ----------
  function lockScreen() {
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; }).catch(function () {}); } catch (e) {}
  }
  function unlockScreen() { try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {} }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && $('prompter').style.display === 'block') lockScreen();
  });

  // ---------- controls ----------
  function applyFont() { $('track').style.setProperty('--fs', fs + 'px'); $('track').style.fontSize = fs + 'px'; metricsDirty = true; }
  function applyMirror() { $('stage').classList.toggle('mirror', mirror); $('mirrorBtn').classList.toggle('on', mirror); }
  function bump() {
    $('bar').classList.remove('hidden');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () { $('bar').classList.add('hidden'); }, 5000);
  }
  function relayout() {
    metricsDirty = true;
    if ($('prompter').style.display === 'block') {
      if (autoOn) { computeMetrics(); cy = cyForPos(); applyCy(); } else center(true);
    }
  }

  $('start').addEventListener('click', function () {
    if (!/\S/.test(scriptEl.value)) { scriptEl.focus(); return; }
    store('vp_script', scriptEl.value);
    $('setup').style.display = 'none';
    $('prompter').style.display = 'block';
    build(); applyFont(); applyMirror(); updatePlay(); updateWpm();
    shownPos = -1; setPos(0, true);
    goFull();
    lockScreen(); bump();
    if (mode === 'voice') { wantListening = true; startRec(); }
  });
  $('back').addEventListener('click', function () {
    stopRec(); stopAuto(); unlockScreen(); exitFull();
    $('prompter').style.display = 'none'; $('setup').style.display = 'flex';
    $('size').value = fs; $('mirrorChk').checked = mirror;
  });
  $('restart').addEventListener('click', function () { setPos(0); });
  $('prev').addEventListener('click', function () { stepSentence(-1); });
  $('next').addEventListener('click', function () { stepSentence(1); });
  $('mic').addEventListener('click', toggleListen);
  $('play').addEventListener('click', togglePlay);
  $('slower').addEventListener('click', function () { wpm = Math.max(40, wpm - 10); store('vp_wpm', wpm); updateWpm(); });
  $('faster').addEventListener('click', function () { wpm = Math.min(400, wpm + 10); store('vp_wpm', wpm); updateWpm(); });
  $('smaller').addEventListener('click', function () { fs = Math.max(28, fs - 6); store('vp_fs', fs); applyFont(); relayout(); });
  $('bigger').addEventListener('click', function () { fs = Math.min(140, fs + 6); store('vp_fs', fs); applyFont(); relayout(); });
  $('mirrorBtn').addEventListener('click', function () { mirror = !mirror; store('vp_mirror', mirror ? '1' : '0'); applyMirror(); });
  function goFull() {
    try {
      var el = document.documentElement;
      var f = el.requestFullscreen || el.webkitRequestFullscreen;
      if (f && !(document.fullscreenElement || document.webkitFullscreenElement)) { var r = f.call(el); if (r && r.catch) r.catch(function () {}); }
    } catch (e) {}
  }
  function exitFull() {
    try {
      var f = document.exitFullscreen || document.webkitExitFullscreen;
      if (f && (document.fullscreenElement || document.webkitFullscreenElement)) { var r = f.call(document); if (r && r.catch) r.catch(function () {}); }
    } catch (e) {}
  }
  $('full').addEventListener('click', goFull);
  document.addEventListener('fullscreenchange', relayout);
  document.addEventListener('webkitfullscreenchange', relayout);
  $('prompter').addEventListener('pointerdown', bump);
  window.addEventListener('resize', relayout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { metricsDirty = true; });
})();
</script>
</body>
</html>
